name: Backend examples

on:
  push:
    branches: [main]
    paths:
      - "examples/backend/spring-boot/**"
      - "examples/backend/aspnet-core/**"
      - "examples/backend/laravel/**"
      - ".github/workflows/backend-examples.yml"
  pull_request:
    paths:
      - "examples/backend/spring-boot/**"
      - "examples/backend/aspnet-core/**"
      - "examples/backend/laravel/**"
      - ".github/workflows/backend-examples.yml"

permissions:
  contents: read

jobs:
  spring-boot:
    name: Spring Boot example
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: examples/backend/spring-boot/pom.xml
      - run: mvn --batch-mode --file examples/backend/spring-boot/pom.xml test

  aspnet-core:
    name: ASP.NET Core example
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test examples/backend/aspnet-core/ConsultaAutofill.AspNetCore.sln --configuration Release

  laravel:
    name: Laravel example
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/backend/laravel
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, curl, mbstring, zip
          coverage: none
      - run: composer validate --strict
      - run: composer update --no-interaction --prefer-dist --no-progress
      - run: composer test
