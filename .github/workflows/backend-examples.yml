name: Backend examples

on:
  push:
    branches: [main]
    paths:
      - "examples/backend/spring-boot/**"
      - "examples/backend/aspnet-core/**"
      - "examples/backend/laravel/**"
      - "examples/backend/nextjs/**"
      - "examples/backend/express/**"
      - "examples/backend/fastapi/**"
      - "examples/backend/go/**"
      - ".github/workflows/backend-examples.yml"
  pull_request:
    paths:
      - "examples/backend/spring-boot/**"
      - "examples/backend/aspnet-core/**"
      - "examples/backend/laravel/**"
      - "examples/backend/nextjs/**"
      - "examples/backend/express/**"
      - "examples/backend/fastapi/**"
      - "examples/backend/go/**"
      - ".github/workflows/backend-examples.yml"

permissions:
  contents: read

jobs:
  nextjs:
    name: Next.js example
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/backend/nextjs
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm test

  express:
    name: Express example
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir examples/backend/express test

  fastapi:
    name: FastAPI example
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/backend/fastapi
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/backend/fastapi/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --requirement requirements.txt
      - run: python -m unittest

  go:
    name: Go example
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/backend/go
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: examples/backend/go/go.mod
          cache-dependency-path: examples/backend/go/go.mod
      - run: go test ./...

  spring-boot:
    name: Spring Boot example
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: examples/backend/spring-boot/pom.xml
      - run: mvn --batch-mode --file examples/backend/spring-boot/pom.xml test

  aspnet-core:
    name: ASP.NET Core example
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test examples/backend/aspnet-core/ConsultaAutofill.AspNetCore.sln --configuration Release

  laravel:
    name: Laravel example
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/backend/laravel
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, curl, mbstring, zip
          coverage: none
      - run: composer validate --strict
      - run: composer update --no-interaction --prefer-dist --no-progress
      - run: composer test
