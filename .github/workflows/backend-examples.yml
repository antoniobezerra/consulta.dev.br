name: Backend examples

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  nextjs:
    name: Next.js example
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/backend/nextjs
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm test

  express:
    name: Express example
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.5.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir examples/backend/express test

  fastapi:
    name: FastAPI example
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/backend/fastapi
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/backend/fastapi/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --requirement requirements.txt
      - run: python -m unittest

  go:
    name: Go example
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/backend/go
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: examples/backend/go/go.mod
          cache-dependency-path: examples/backend/go/go.mod
      - run: go test ./...

  spring-boot:
    name: Spring Boot example
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: examples/backend/spring-boot/pom.xml
      - run: mvn --batch-mode --file examples/backend/spring-boot/pom.xml test

  aspnet-core:
    name: ASP.NET Core example
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test examples/backend/aspnet-core/ConsultaAutofill.AspNetCore.sln --configuration Release

  laravel:
    name: Laravel example
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/backend/laravel
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          extensions: dom, curl, mbstring, zip
          coverage: none
      - run: composer validate --strict
      - run: composer update --no-interaction --prefer-dist --no-progress
      - run: composer test

  verify:
    name: backend examples
    if: always()
    needs: [nextjs, express, fastapi, go, spring-boot, aspnet-core, laravel]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every backend bridge to pass
        env:
          NEXTJS_RESULT: ${{ needs.nextjs.result }}
          EXPRESS_RESULT: ${{ needs.express.result }}
          FASTAPI_RESULT: ${{ needs.fastapi.result }}
          GO_RESULT: ${{ needs.go.result }}
          SPRING_RESULT: ${{ needs['spring-boot'].result }}
          ASPNET_RESULT: ${{ needs['aspnet-core'].result }}
          LARAVEL_RESULT: ${{ needs.laravel.result }}
        run: |
          for result in "$NEXTJS_RESULT" "$EXPRESS_RESULT" "$FASTAPI_RESULT" "$GO_RESULT" "$SPRING_RESULT" "$ASPNET_RESULT" "$LARAVEL_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "A matriz de exemplos de backend não foi aprovada: $result"
              exit 1
            fi
          done
