name: QR-only WASM candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/qr-engine/**"
      - "apps/embed/**"
      - ".github/workflows/qr-only.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify QR-only candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.5.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm sanitize:public
      - run: pnpm licenses:verify
      - run: pnpm --filter @consulta-dev/qr-engine run qr-only:build
        env:
          QR_ONLY_OUTPUT_DIR: ${{ github.workspace }}/qr-only-artifact
      - run: pnpm --filter @consulta-dev/qr-engine run qr-only:build
        env:
          QR_ONLY_OUTPUT_DIR: ${{ github.workspace }}/qr-only-reproducible-artifact
          QR_ONLY_BUILD_NO_CACHE: "1"
      - run: pnpm --filter @consulta-dev/qr-engine run qr-only:verify
        env:
          QR_ONLY_OUTPUT_DIR: ${{ github.workspace }}/qr-only-artifact
      - run: pnpm --filter @consulta-dev/qr-engine run qr-only:verify
        env:
          QR_ONLY_OUTPUT_DIR: ${{ github.workspace }}/qr-only-reproducible-artifact
      - run: pnpm --filter @consulta-dev/qr-engine run qr-only:reproducible
        env:
          QR_ONLY_OUTPUT_DIR: ${{ github.workspace }}/qr-only-artifact
          QR_ONLY_REPRODUCIBLE_OUTPUT_DIR: ${{ github.workspace }}/qr-only-reproducible-artifact
      - run: pnpm --filter @consulta-dev/qr-engine run qr-only:test
        env:
          QR_ONLY_OUTPUT_DIR: ${{ github.workspace }}/qr-only-artifact
      - run: pnpm --filter @consulta-dev/qr-engine run qr-only:parity
        env:
          QR_ONLY_OUTPUT_DIR: ${{ github.workspace }}/qr-only-artifact
      - run: pnpm exec playwright install --with-deps chromium firefox webkit msedge
      - run: pnpm --filter @consulta-dev/qr-engine run qr-only:benchmark
        env:
          QR_ONLY_OUTPUT_DIR: ${{ github.workspace }}/qr-only-artifact
      - run: pnpm --filter @consulta-dev/qr-engine run qr-only:firefox
        env:
          QR_ONLY_OUTPUT_DIR: ${{ github.workspace }}/qr-only-artifact
      - run: pnpm --filter @consulta-dev/qr-engine run qr-only:webkit
        env:
          QR_ONLY_OUTPUT_DIR: ${{ github.workspace }}/qr-only-artifact
      - run: pnpm --filter @consulta-dev/qr-engine run qr-only:edge
        env:
          QR_ONLY_OUTPUT_DIR: ${{ github.workspace }}/qr-only-artifact
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: consulta-qr-only-${{ github.sha }}
          path: qr-only-artifact
          if-no-files-found: error
          retention-days: 14
